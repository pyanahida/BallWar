<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ball War</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>Ball War</h1>
  
  <div id="controls">
    <div class="player-setup">
      <label>Ball A</label>
      <select id="typeA"></select>
      <label class="toggle">
        <input type="checkbox" id="enableA" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="player-setup">
      <label>Ball B</label>
      <select id="typeB"></select>
      <label class="toggle">
        <input type="checkbox" id="enableB" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="player-setup" style="justify-content: flex-start; gap: 10px;">
      <label for="speedMultiplier">Speed</label>
      <input type="number" id="speedMultiplier" value="1" min="0.1" step="0.1" style="width: 80px; background: #0a0f1e; color: #e0e6f0; border: 1px solid #2a3550; border-radius: 4px; padding: 4px 8px; font-size: 14px; outline: none;">
      <span style="font-size: 12px; color: #8ab4ff;">x</span>
    </div>

    <div style="display: flex; gap: 10px; width: 100%;">
      <button id="startBtn" style="flex: 1;">Start / Reset</button>
      <button id="pauseBtn" style="flex: 1; background: #555; display: none;">Pause</button>
    </div>
  </div>

  <div id="arena-wrap">
    <svg id="arena" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="pauseOverlay" class="overlay hidden">
      <div class="overlay-content">
        <h2>Paused</h2>
        <button id="resumeBtn">Resume</button>
        <button id="quitBtn">Quit to Menu</button>
      </div>
    </div>
    <div id="gameoverOverlay" class="overlay hidden">
      <div class="overlay-content">
        <h2 id="winnerText">Winner</h2>
        <button id="backToMenuBtn">Back to Menu</button>
      </div>
    </div>
  </div>
</div>

<script src="js/effects.js"></script>
<script src="js/ball.js"></script>
<script src="js/physics.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
