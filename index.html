<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ball War</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>Ball War</h1>
  
  <div id="controls">
    <div class="player-setup">
      <label>Ball A</label>
      <select id="typeA">
        <option value="common">Common</option>
        <option value="spear">Spear</option>
        <option value="void">Void</option>
        <option value="steel_coil">Steel Coil</option>
        <option value="one_way_mirror">One-way Mirror</option>
        <option value="spider_web">Spider Web</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="enableA" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="player-setup">
      <label>Ball B</label>
      <select id="typeB">
        <option value="common">Common</option>
        <option value="spear" selected>Spear</option>
        <option value="void">Void</option>
        <option value="steel_coil">Steel Coil</option>
        <option value="one_way_mirror">One-way Mirror</option>
        <option value="spider_web">Spider Web</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="enableB" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="player-setup" style="justify-content: flex-start; gap: 10px;">
      <label for="speedMultiplier">Speed</label>
      <input type="number" id="speedMultiplier" value="1" min="0.1" step="0.1" style="width: 80px; background: #0a0f1e; color: #e0e6f0; border: 1px solid #2a3550; border-radius: 4px; padding: 4px 8px; font-size: 14px; outline: none;">
      <span style="font-size: 12px; color: #8ab4ff;">x</span>
    </div>

    <button id="startBtn">Start / Reset</button>
  </div>

  <div id="arena-wrap">
    <svg id="arena" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>

<script src="js/ball.js"></script>
<script src="js/physics.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
