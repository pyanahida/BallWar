<div id="switches">
  <label class="switch-row">
    <span>Ball A</span>
    <select id="typeA">
      <option value="common">Common</option>
      <option value="spear">Spear</option>
      <option value="void">Void</option>
    </select>
    <span class="switch">
      <input type="checkbox" id="switchA" checked>
      <span class="slider"></span>
    </span>
  </label>
  <label class="switch-row">
    <span>Ball B</span>
    <select id="typeB">
      <option value="common">Common</option>
      <option value="spear" selected>Spear</option>
      <option value="void">Void</option>
    </select>
    <span class="switch">
      <input type="checkbox" id="switchB" checked>
      <span class="slider"></span>
    </span>
  </label>
</div>
