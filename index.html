<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h1>Ball Arena</h1>
  <div id="switches">
    <label class="switch-row">
      <span>Ball A</span>
      <span class="switch">
        <input type="checkbox" id="switchA" checked>
        <span class="slider"></span>
      </span>
    </label>
    <label class="switch-row">
      <span>Ball B</span>
      <span class="switch">
        <input type="checkbox" id="switchB" checked>
        <span class="slider"></span>
      </span>
    </label>
  </div>
  <div id="arena-wrap">
    <svg id="arena" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <button id="resetBtn">Reset</button>
</div>
<script src="js/ball.js"></script>
<script src="js/physics.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
